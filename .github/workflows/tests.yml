name: Tests CI

# Chequeo mínimo previo al deploy (deploy.yml se dispara cuando esto pasa en main).
# Por ahora solo hay tests unitarios básicos; cuando existan tests de Feature
# con base de datos, agregar acá el servicio mariadb, migraciones y la suite completa.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, intl, pdo_mysql, gd, zip, bcmath
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Composer Dependencies
      run: composer install --no-progress --prefer-dist --no-interaction

    - name: Lint PHP (sintaxis)
      run: find app config database routes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

    - name: Build Assets
      run: |
        npm ci
        npm run build
        test -f public/build/manifest.json

    - name: Unit Tests
      run: ./vendor/bin/phpunit --testsuite Unit
