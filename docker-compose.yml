# PAICAT - Configuración Docker para Desarrollo
# Uso: docker compose up -d

services:
  # Laravel + Apache
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: paicat_app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:cached
      # Volúmenes Docker para carpetas con muchos archivos (mejora rendimiento en Windows)
      - app_vendor:/var/www/html/vendor
      - app_storage_framework:/var/www/html/storage/framework
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=paicat
      - DB_USERNAME=paicat
      - DB_PASSWORD=paicat
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - paicat_network
    restart: unless-stopped

  # MariaDB 11 - Contiene BD paicat y alumnos_utn
  mariadb:
    image: mariadb:11
    container_name: paicat_mariadb
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paicat
      MYSQL_USER: paicat
      MYSQL_PASSWORD: paicat
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-alumnos.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - paicat_network
    restart: unless-stopped

  # Vite Dev Server (Hot Module Replacement)
  vite:
    image: node:20-alpine
    container_name: paicat_vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html:cached
      - vite_node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - paicat_network
    restart: unless-stopped
    depends_on:
      - app

networks:
  paicat_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  vite_node_modules:
    driver: local
  app_vendor:
    driver: local
  app_storage_framework:
    driver: local
