# PAICAT - Configuración Docker para Producción
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# IMPORTANTE: Configurar variables de entorno antes de usar:
# - Copiar .env.example a .env
# - Configurar credenciales de BD seguras

services:
  # Laravel + Apache
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: paicat_app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:cached
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-paicat}
      - DB_USERNAME=${DB_USERNAME:-paicat}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - paicat_network
    restart: always

  # MariaDB 11
  mariadb:
    image: mariadb:11
    container_name: paicat_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-paicat}
      MYSQL_USER: ${DB_USERNAME:-paicat}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paicat_network
    restart: always

networks:
  paicat_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
